name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  quality:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:format
      - run: npm run build

  publish:
    # Only publish when a release tag (vX.Y.Z) is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    name: Publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Creates a public GitHub release (releaseType: release) and uploads the
      # installer + latest.yml, which electron-updater uses for auto-updates.
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
