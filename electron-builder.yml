appId: com.ryan.ryans-launcher-vibe
productName: "Ryan's Launcher Vibe"
copyright: 'Copyright © 2026 Ryan'

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json

win:
  # Publisher name written into the exe / installer metadata (matches package.json author).
  publisherName: Ryan
  target:
    - target: nsis
      arch:
        - x64
  artifactName: '${productName}-Setup-${version}-win-x64.${ext}'

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true

extraResources:
  - from: resources/bin/easytier
    to: bin/easytier
    filter:
      - '**/*'

extraMetadata:
  main: dist/main/src/main/index.js

publish:
  provider: github
  owner: RLVDev-Ryan
  repo: RLV
  # Default is `draft`, which would hide every release. `release` makes
  # `dist:publish` (and the CI tag workflow) create a public release.
  releaseType: release

# macOS and Linux targets to be added later. When they are, each platform needs
# its own easytier binaries (resources/bin/easytier/mac, .../linux) and a
# per-platform `extraResources` block — the current one ships the Windows exe.
